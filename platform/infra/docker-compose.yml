# Services de développement : Postgres + Redis.
# Ports hôte décalés (5433 / 6380) pour ne pas entrer en conflit avec citimoov-v2 (5432 / 6379).
name: toctoc

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: toctoc
      POSTGRES_PASSWORD: toctoc
      POSTGRES_DB: toctoc
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U toctoc -d toctoc']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '6380:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  redis_data:
